---
- name: Kubernetes Post-Installation
  hosts: all
  become: true
  tasks:
    - name: Map old and new hostname to 127.0.1.1
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 {{ inventory_hostname }} {{ ansible_hostname }}"

    - name: Set hostname from inventory
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Keep only the new hostname in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 {{ inventory_hostname }}"
    - name: Download Kubernetes repository signing key
      become: true
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'

    - name: Add Kubernetes repository
      become: true
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /"
        filename: kubernetes
        state: present
        update_cache: true

    - name: Download containerd package
      become: true
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/debian/dists/bookworm/pool/stable/amd64/containerd.io_2.3.5-1~debian.12~bookworm_amd64.deb"
        dest: "/tmp/containerd.deb"
        mode: '0644'

    - name: Install containerd package
      become: true
      ansible.builtin.apt:
        deb: "/tmp/containerd.deb"

    - name: Configure containerd for Kubernetes
      ansible.builtin.template:
        src: config.toml
        dest: /etc/containerd/config.toml
        mode: "0644"
      notify: Restart containerd

    - name: Enable and start containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started
        daemon_reload: true

    - name: Install kubeadm, kubelet, and kubectl
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop:
        - kubeadm
        - kubelet
        - kubectl

- name: Kubernetes master Post-Installation
  hosts: master
  become: true
  tasks:
    - name: Initialize Kubernetes master
      ansible.builtin.command:
        cmd: kubeadm init --pod-network-cidr=10.48.0.0/16
      register: kubeadm_output
      ignore_errors: true
      changed_when: true

    - name: Create kubeconfig directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        owner: "{{ ansible_user_uid }}"
        group: "{{ ansible_user_gid }}"
        mode: "0700"

    - name: Copy admin kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ ansible_env.HOME }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user_uid }}"
        group: "{{ ansible_user_gid }}"
        mode: "0600"
      changed_when: true

    - name: Install Calico network plugin
      ansible.builtin.command:
        cmd: kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml
      changed_when: true

    - name: Create kubeadm join command
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      register: kubeadm_join
      changed_when: false

    - name: Save join command
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ kubeadm_join.stdout }}"

- name: Kubernetes worker Post-Installation
  hosts: workers
  become: true
  tasks:
    - name: Join worker to Kubernetes
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['master'][0]]['kubeadm_join_command'] }}"
        creates: /etc/kubernetes/kubelet.conf
      register: join_result
