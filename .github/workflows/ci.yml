name: CI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      packer:  { type: boolean, default: false }
      tofu:    { type: boolean, default: false }
      ansible: { type: boolean, default: false }
permissions:
  id-token: write
  contents: read
jobs:
  packer-validate:                     
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packer validate -syntax-only .
        working-directory: packer
  packer-deploy:
    needs: packer-validate
    runs-on: self-hosted
    environment: dev
    if: github.ref == 'refs/heads/main' && inputs.packer == true
    steps:
      - uses: actions/checkout@v4
      - run: packer build -force .
        working-directory: packer

  tofu-plan:                   
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: tofu init
        working-directory: terraform
      - run: tofu fmt -check
        working-directory: terraform
      - run: tofu validate
        working-directory: terraform
      - run: tofu plan -out=tfplan
        working-directory: terraform
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1

  tofu-deploy:
    needs: [tofu-plan, packer-deploy]
    runs-on: self-hosted
    environment: dev
    if: ${{ always() && inputs.tofu && needs.packer-deploy.result != 'failure' && needs.packer-deploy.result != 'cancelled' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4     # przypnij do SHA
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}          # Settings → Variables → Actions
          aws-region: eu-central-1
          audience: sts.amazonaws.com
      - run: tofu init
        working-directory: terraform
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform
      - run: tofu apply tfplan -auto-approve
        working-directory: terraform

  ansible-validate:                
    runs-on: ubuntu-latest
    container:
      image: pipelinecomponents/ansible-lint:latest
    steps:
      - uses: actions/checkout@v4
      - run: ansible-lint -f pep8
        working-directory: ansible
      - run: ansible-playbook --syntax-check k8s-pre.yaml
        working-directory: ansible
      - run: ansible-playbook --syntax-check k8s-post.yaml
        working-directory: ansible
  ansible-deploy:
    needs: [ansible-validate, tofu-deploy]
    runs-on: self-hosted
    environment: dev
    if: ${{ always() && inputs.ansible && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - run: ansible-playbook -i inventory.yaml k8s-post.yaml
        working-directory: ansible