---
- hosts: master:workers
  become: yes
  tasks:

    - name: Install prerequisites
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gpg
          - libseccomp2
        state: present
        update_cache: true

    - name: Create keyrings directory
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Load required kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules across reboots
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Set required sysctl params for Kubernetes
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/k8s.conf
      loop:
        - { name: "net.ipv4.ip_forward", value: "1" }
        - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
        - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
            
    - name: Disable swap immediately
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Disable swap permanently
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#]\S+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'

    - name: Download Kubernetes repository signing key
      become: true
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'

    - name: Add Kubernetes repository
      become: true
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /"
        filename: kubernetes
        state: present
        update_cache: true

    - name: Download containerd package
      become: true
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/debian/dists/trixie/pool/stable/amd64/containerd.io_2.3.5-1~debian.13~trixie_amd64.deb"
        dest: "/tmp/containerd.deb"
        mode: '0644'

    - name: Install containerd package
      become: true
      ansible.builtin.apt:
        deb: "/tmp/containerd.deb"

    - name: Configure containerd for Kubernetes
      template:
        src: config.toml
        dest: /etc/containerd/config.toml
      notify: Restart containerd

    - name: Enable and start containerd
      systemd:
        name: containerd
        enabled: true
        state: started
        daemon_reload: true


    - name: Install kubeadm, kubelet, and kubectl
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - kubeadm
        - kubelet
        - kubectl
  handlers:
    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true
- hosts: master
  become: yes
  tasks:
    - name: Initialize Kubernetes master
      command: kubeadm init --pod-network-cidr=10.48.0.0/16
      register: kubeadm_output
      ignore_errors: yes

    - name: Create kubeconfig directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        owner: "{{ ansible_user_uid }}"
        group: "{{ ansible_user_gid }}"
        mode: "0700"

    - name: Copy admin kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ ansible_env.HOME }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user_uid }}"
        group: "{{ ansible_user_gid }}"
        mode: "0600"

    - name: Install Calico network plugin
      command: kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml

    - name: Create kubeadm join command
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      register: kubeadm_join
      changed_when: false

    - name: Save join command
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ kubeadm_join.stdout }}"

- hosts: workers
  become: yes
  tasks:
    - name: Join worker to Kubernetes
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['master'][0]]['kubeadm_join_command'] }}"