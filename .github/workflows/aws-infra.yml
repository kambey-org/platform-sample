name: AWS infrastructure

on:
  pull_request:
    branches: [ "main" ]
    paths:
      [ "terraform/aws/**", ".github/workflows/aws-infra.yml" ]
  push:
    branches: [ "main" ]
    paths:
      [ "terraform/aws/**", ".github/workflows/aws-infra.yml" ]
permissions:
  id-token: write
  contents: read

jobs:
  vpc-plan:                   
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: vpc-plan-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: opentofu/setup-opentofu@v1
        with:
          version: 1.13.10
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4    
        with:
          role-to-assume: ${{ vars.VPC_TOFU_PLAN_ARN }}         
          aws-region: eu-central-1
          audience: sts.amazonaws.com
      - run: tofu init -input=false
        working-directory: terraform/aws/stacks/vpc
      - run: tofu fmt -check -recursive
        working-directory: terraform/aws
      - run: tofu validate
        working-directory: terraform/aws/stacks/vpc
      - run: tofu plan -out=vpc-plan -input=false 
        working-directory: terraform/aws/stacks/vpc
      - uses: actions/upload-artifact@v4
        with:
          name: vpc-plan
          path: terraform/aws/stacks/vpc/vpc-plan
          retention-days: 1

  vpc-apply:
    needs: [vpc-plan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: vpc-apply
      cancel-in-progress: false
    environment: prod
    steps:
      - uses: opentofu/setup-opentofu@v1
        with:
          version: 1.13.10
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4    
        with:
          role-to-assume: ${{ vars.VPC_TOFU_APPLY_ARN }}          
          aws-region: eu-central-1
          audience: sts.amazonaws.com
      - run: tofu init -input=false
        working-directory: terraform/aws/stacks/vpc
      - uses: actions/download-artifact@v4
        with:
          name: vpc-plan
          path: terraform/aws/stacks/vpc
      - run: tofu apply vpc-plan -auto-approve -input=false
        working-directory: terraform/aws/stacks/vpc