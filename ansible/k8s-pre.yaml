---
- name: Kubernetes Pre-Installation
  hosts: all
  become: yes
  tasks:

    - name: Install prerequisites
      become: true
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gpg
          - libseccomp2
          - ssh
        state: present
        update_cache: true

    - name: Create ssh.service drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/ssh.service.d
        state: directory
        mode: '0755'

    - name: Drop-in to generate SSH host keys at boot
      ansible.builtin.copy:
        dest: /etc/systemd/system/ssh.service.d/hostkeys.conf
        content: |
          [Service]
          ExecStartPre=
          ExecStartPre=/usr/bin/ssh-keygen -A
          ExecStartPre=/usr/sbin/sshd -t
      notify: Reload systemd


    - name: Authorize SSH key for ansible user
      ansible.posix.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    - name: Passwordless sudo for ansible
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ansible
        content: "ansible ALL=(ALL) NOPASSWD:ALL\n"
        mode: '0440'
        validate: 'visudo -cf %s'
      
    - name: Install QEMU Guest Agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present

    - name: Enable QEMU Guest Agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true
        
    - name: Enable and start serial-getty
      systemd:
        name: serial-getty@ttyS0.service
        enabled: true
        state: started
        daemon_reload: true

    - name: Create keyrings directory
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Load required kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules across reboots
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Set required sysctl params for Kubernetes
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/k8s.conf
      loop:
        - { name: "net.ipv4.ip_forward", value: "1" }
        - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
        - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
            
    - name: Disable swap immediately
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Disable swap permanently
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#]\S+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'

    - name: Download Kubernetes repository signing key
      become: true
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'

    - name: Add Kubernetes repository
      become: true
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /"
        filename: kubernetes
        state: present
        update_cache: true

    - name: Download containerd package
      become: true
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/debian/dists/bookworm/pool/stable/amd64/containerd.io_2.3.5-1~debian.12~bookworm_amd64.deb"
        dest: "/tmp/containerd.deb"
        mode: '0644'

    - name: Install containerd package
      become: true
      ansible.builtin.apt:
        deb: "/tmp/containerd.deb"

    - name: Configure containerd for Kubernetes
      template:
        src: config.toml
        dest: /etc/containerd/config.toml
      notify: Restart containerd

    - name: Enable and start containerd
      systemd:
        name: containerd
        enabled: true
        state: started
        daemon_reload: true

    - name: Install kubeadm, kubelet, and kubectl
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - kubeadm
        - kubelet
        - kubectl

    - name: Add serial console to GRUB
      ansible.builtin.replace:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX="(?!.*ttyS0)([^"]*)"$'
        replace: 'GRUB_CMDLINE_LINUX="\1 console=tty0 console=ttyS0,115200n8"'
      notify: Update GRUB

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Remove SSH host keys (generated per VM at boot)
      ansible.builtin.shell: rm -f /etc/ssh/ssh_host_*
      changed_when: true

    - name: Reset machine-id (regenerated on first boot)
      ansible.builtin.shell: truncate -s 0 /etc/machine-id
      changed_when: true

    - name: Clean apt cache
      ansible.builtin.apt:
        autoclean: true
        autoremove: true

    - name: Ensure current hostname resolves
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 {{ ansible_hostname }}"

  handlers:
    - name: Update GRUB
      ansible.builtin.command: update-grub

    - name: Reload systemd
      ansible.builtin.systemd: 
        daemon_reload: true

    - name: Restart containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true
