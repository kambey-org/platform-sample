### preseed.cfg — Debian 12 (Bookworm), baza pod K8s

## Lokalizacja i klawiatura
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select pl

## Sieć
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-k8s-base
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

## Mirror (repo apt)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

## Zegar / strefa czasowa
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Warsaw
d-i clock-setup/ntp boolean true

## Konto użytkownika (do SSH przez Packera)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Ansible User
d-i passwd/username string ansible
d-i passwd/user-password password tymczasowe-haslo
d-i passwd/user-password-again password tymczasowe-haslo
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

## Partycjonowanie — automatyczne, cały dysk, bez LVM (prościej dla obrazu bazowego)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

## Apt — minimalny setup, bez CD, bez popcon
d-i apt-setup/cdrom/set-first boolean false
d-i popularity-contest/participate boolean false

## Pakiety instalowane od razu (reszta pójdzie przez Ansible/provisioner)
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server sudo curl gnupg2 ca-certificates
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select none

## Sudo bez hasła dla usera ansible (przydatne pod automatyzację)
d-i preseed/late_command string \
    in-target sh -c 'echo "ansible ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/ansible'; \
    in-target sh -c 'chmod 440 /etc/sudoers.d/ansible'

## GRUB — instalacja na dysk główny
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

## Koniec instalacji — bez czekania na wyjęcie CD
d-i finish-install/reboot_in_progress note