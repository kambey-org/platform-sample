---
- name: Kubernetes Post-Installation
  hosts: all
  become: true
  tasks:
    - name: Map old and new hostname to 127.0.1.1
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 {{ inventory_hostname }} {{ ansible_hostname }}"

    - name: Set hostname from inventory
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Keep only the new hostname in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1'
        line: "127.0.1.1 {{ inventory_hostname }}"

- name: Kubernetes worker Post-Installation
  hosts: master
  become: true
  tasks:
    - name: Initialize Kubernetes master
      command: kubeadm init --pod-network-cidr=10.48.0.0/16
      register: kubeadm_output
      ignore_errors: true

    - name: Create kubeconfig directory
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.kube"
        state: directory
        owner: "{{ ansible_user_uid }}"
        group: "{{ ansible_user_gid }}"
        mode: "0700"

    - name: Copy admin kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ ansible_env.HOME }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user_uid }}"
        group: "{{ ansible_user_gid }}"
        mode: "0600"

    - name: Install Calico network plugin
      command: kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml

    - name: Create kubeadm join command
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      register: kubeadm_join
      changed_when: false

    - name: Save join command
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ kubeadm_join.stdout }}"

- name: Kubernetes worker Post-Installation
  hosts: workers
  become: true
  tasks:
    - name: Join worker to Kubernetes
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['master'][0]]['kubeadm_join_command'] }}"
        creates: /etc/kubernetes/kubelet.conf
      register: join_result
